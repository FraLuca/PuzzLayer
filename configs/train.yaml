  MODEL_INPUT_DIM: 64
  MODEL_OUTPUT_DIM: 64
  PROJ_OUTPUT_DIM: 64
  DROPOUT: 0.1
  DIFFUSION_PER_LAYER: False

WANDB:
  ENABLE: True
  GROUP: "diffusion"
  PROJECT: "PuzzLayer"
  ENTITY: "pinlab-sapienza"
  OFFLINE: False

DATASETS:
  TRAIN: "datasets/trainVAR/"   # mnist, cifar10, cifar100, imagenette, imagenet
  TEST: "datasets/validVAR/"
  TEXT: "datasets/texts/var_text_embeddings.pt"

SOLVER:
 GPUS: [0,1,3,5,6,7]
